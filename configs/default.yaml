# Default training configuration for Toronto Transit RL

# Environment parameters
env:
  grid_size: [40, 30]
  n_zones: 100
  budget: 5000.0
  station_cost: 500.0
  line_cost_per_km: 200.0
  max_steps: 20
  equity_weight: 0.3
  normalize_obs: false

# Training parameters
training:
  total_steps: 1000000
  num_envs: 8
  learning_rate: 0.0003
  batch_size: 256
  num_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Logging
logging:
  log_interval: 10  # Log every N updates
  save_interval: 1000  # Save checkpoint every N updates
  wandb_project: "toronto-transit-rl"
  wandb_entity: null
  use_wandb: false
  use_tensorboard: true

# Checkpoints
checkpoints:
  save_dir: "checkpoints"
  load_path: null  # Path to checkpoint to resume from
